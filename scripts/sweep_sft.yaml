# ==============================================================================
# W&B Sweep Configuration: Supervised Fine-Tuning (SFT)
#
# Launch Instructions:
# 1. Initialize the sweep on W&B:
#      wandb sweep scripts/sweep_sft.yaml
#    This returns a sweep ID formatted as: <entity>/<project>/<sweep_id>
#
# 2. Start a sweep agent to execute runs:
#      wandb agent <entity>/<project>/<sweep_id>
#    (Optional: add --count <N> to run a fixed number of trials)
# ==============================================================================

program: src/writer_sft.py
method: bayes
metric:
  name: eval/loss
  goal: minimize

command:
  - ${env}
  - accelerate
  - launch
  - --config_file=scripts/deepspeed_config.yaml
  - ${program}
  - --report_to=wandb
  - --logging_steps=1
  - --logging_strategy=steps
  - --task_name=npov
  - --dataset_repo_id=leobianco/npov_sft
  - --model_repo_id=google/gemma-4-E2B-it
  - --do_train=True
  - --bf16=True
  - --do_eval=True
  - --eval_strategy=epoch
  - --save_strategy=no
  - --per_device_train_batch_size=16
  - --per_device_eval_batch_size=16
  - --auto_find_batch_size=True
  - --lr_scheduler_type=cosine
  - --warmup_ratio=0.1
  - --peft_type=LORA
  - --task_type=CAUSAL_LM
  - ${args}

parameters:
  seed:
    values:
      - 42
      - 12345
      - 130104
  num_train_epochs:
    values:
      - 1
      - 2
      - 3
  learning_rate:
    distribution: log_uniform_values
    min: 0.0001
    max: 0.005
  lora_r:
    values:
      - 4
      - 8
      - 16
      - 32
  lora_alpha:
    values:
      - 8
      - 16
      - 32
      - 64
