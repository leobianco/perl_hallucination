# ==============================================================================
# W&B Sweep Configuration: Reward Model (RM) Training with Token Mismatch
#
# Tests training the RM on different terminal tokens (<eos>, <end_of_turn>, none)
# ==============================================================================

program: src/token_mismatch/reward_model.py
method: grid
metric:
  name: eval/roc_auc
  goal: maximize

command:
  - ${env}
  - accelerate
  - launch
  - --config_file=scripts/deepspeed_config.yaml
  - ${program}
  - --report_to=wandb
  - --logging_steps=1
  - --logging_strategy=steps
  - --task_name=npov
  - --seed=130104
  - --dataset_repo_id=leobianco/npov_rm_organic
  - --model_repo_id=google/gemma-3-1b-it
  - --num_organic_hallus_to_keep=0
  - --num_struct_hallus_to_keep=0
  - --do_train=True
  - --bf16=True
  - --do_eval=True
  - --eval_strategy=steps
  - --eval_steps=50
  - --eval_on_start=True
  - --save_strategy=no
  - --per_device_train_batch_size=16
  - --per_device_eval_batch_size=32
  - --auto_find_batch_size=True
  - --lr_scheduler_type=cosine
  - --warmup_ratio=0.1
  - --peft_type=LORA
  - --task_type=SEQ_CLS
  - --num_train_epochs=3
  - --learning_rate=0.001
  - ${args}

parameters:
  rm_terminal_token:
    values:
      - eos
      - end_of_turn
      - none
