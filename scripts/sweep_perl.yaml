# ==============================================================================
# W&B Sweep Configuration: Parameter-Efficient Reinforcement Learning (PE-RL / RLOO)
#
# Launch Instructions:
# 1. Initialize the sweep on W&B:
#      wandb sweep scripts/sweep_perl.yaml
#    This returns a sweep ID formatted as: <entity>/<project>/<sweep_id>
#
# 2. Start a sweep agent to execute runs:
#      wandb agent <entity>/<project>/<sweep_id>
#    (Optional: add --count <N> to run a fixed number of trials)
# ==============================================================================

program: src/perl.py
method: bayes
metric:
  name: train/rewards/reward_fn/mean
  goal: maximize

command:
  - ${env}
  - accelerate
  - launch
  - --config_file=scripts/deepspeed_config.yaml
  - ${program}
  - --report_to=wandb
  - --logging_steps=1
  - --logging_strategy=steps
  - --log_completions=True
  - --task_name=npov
  - --seed=130104
  - --dataset_repo_id=leobianco/npov_perl
  - --model_repo_id=google/gemma-4-E2B-it
  - --sft_model_path=leobianco/
  - --reward_model_path=leobianco/
  - --do_train=True
  - --do_eval=True
  - --eval_strategy=steps
  - --eval_steps=50
  - --eval_on_start=True
  - --save_only_model=True
  - --save_strategy=no
  - --lr_scheduler_type=cosine
  - --warmup_ratio=0.1
  - --max_completion_length=256
  - --num_generations=4
  - --num_iterations=1
  - --steps_per_generation=16
  - --per_device_train_batch_size=8
  - --per_device_eval_batch_size=8
  - --auto_find_batch_size=False
  - ${args}

parameters:
  num_train_epochs:
    values:
      - 0.2
  learning_rate:
    distribution: log_uniform_values
    min: 0.000005
    max: 0.0001
  beta:
    distribution: log_uniform_values
    min: 0.0001
    max: 0.05
  temperature:
    values:
      - 0.3
      - 0.6
      - 1.0
