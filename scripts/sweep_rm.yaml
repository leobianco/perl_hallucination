# ==============================================================================
# W&B Sweep Configuration: Reward Model (RM) Training
#
# Launch Instructions:
# 1. Initialize the sweep on W&B:
#      wandb sweep scripts/sweep_rm.yaml
#    This returns a sweep ID formatted as: <entity>/<project>/<sweep_id>
#
# 2. Start a sweep agent to execute runs:
#      wandb agent <entity>/<project>/<sweep_id>
#    (Optional: add --count <N> to run a fixed number of trials)
# ==============================================================================

program: src/reward_model.py
method: bayes
metric:
  name: eval/roc_auc
  goal: maximize

command:
  - ${env}
  - accelerate
  - launch
  - --config_file=scripts/deepspeed_config.yaml
  - ${program}
  - --report_to=wandb
  - --logging_steps=1
  - --logging_strategy=steps
  - --task_name=npov
  - --seed=130104
  - --dataset_repo_id=leobianco/npov_rm_organic
  - --model_repo_id=google/gemma-3-1b-it
  - --num_organic_hallus_to_keep=0
  - --num_struct_hallus_to_keep=0
  - --do_train=True
  - --bf16=True
  - --do_eval=True
  - --eval_strategy=steps
  - --eval_steps=50
  - --eval_on_start=True
  - --save_strategy=no
  - --per_device_train_batch_size=16
  - --per_device_eval_batch_size=32
  - --auto_find_batch_size=True
  - --lr_scheduler_type=cosine
  - --warmup_ratio=0.1
  - --peft_type=LORA
  - --task_type=SEQ_CLS
  - ${args}

parameters:
  num_train_epochs:
    values:
      - 1
      - 3
      - 5
      - 15
  learning_rate:
    distribution: log_uniform_values
    min: 0.0001
    max: 0.003
  lora_r:
    values:
      - 4
      - 8
      - 16
      - 32
  lora_alpha:
    values:
      - 8
      - 16
      - 32
      - 64
